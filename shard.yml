name: partiduo-choruspro
version: 0.1.0

description: |
  Extension Chorus Pro de Partiduo (ADR-004 D9 révisé) : factures aux
  clients publics (État, collectivités, établissements publics) déposées
  sur Chorus Pro par l'API du portail PISTE (compte technique, numéro
  d'engagement, code service), suivi des statuts ; écrite contre une
  interface abstraite et une simulation.

authors:
  - Philippe Nénert <it+claude.ai@aloli.fr>

crystal: ">= 1.19.1"

license: AGPL-3.0-or-later

targets:
  partiduo-choruspro-manage:
    main: manage.cr

dependencies:
  # Le cœur : registre, événements et contrat Partiduo::Api.
  partiduo:
    path: ../partiduo-app
  marten:
    path: ../../marten

development_dependencies:
  # L'interface qui monte ui/bulma/ : nécessaire aux specs et à manage.cr ;
  # la distribution l'apporte elle-même.
  partiduo-ui-bulma:
    path: ../partiduo-ui-bulma
  ameba:
    github: crystal-ameba/ameba
    version: "~> 1.6"
